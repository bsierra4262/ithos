  </g>
  <text x="248" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="#ffffff" letter-spacing="4">ITHOS</text>
  <text x="250" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="29" font-weight="500" fill="#e9dcff">Asistente de IA para operaciones · voz, mesa de ayuda y equipo</text>
  <rect x="250" y="236" width="150" height="8" rx="4" fill="url(#accent)"/>
  <text x="250" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#9CC930" letter-spacing="3">INTELLIHELP</text>
