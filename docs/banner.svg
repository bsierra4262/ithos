      <stop offset="0" stop-color="#4a2470"/>
      <stop offset="0.55" stop-color="#663399"/>
      <stop offset="1" stop-color="#7a3fb0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9CC930"/>
      <stop offset="1" stop-color="#c3e85f"/>
