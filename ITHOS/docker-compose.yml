# ITHOS Gestor — despliegue en la VPS (Hostinger, Linux con Docker).
#   1) Copiá .env.example a .env y poné una clave fuerte (ITHOS_ADMIN_TOKEN).
#   2) Editá el Caddyfile con tu dominio.
#   3) docker compose up -d --build
# El agente del cliente se conecta a  wss://TU-DOMINIO/ws  (cifrado, solo sale hacia afuera).
# Solo Caddy publica puertos (80/443). El Gestor (8080) y el Panel (8090) NO se exponen al
# público: se llegan por HTTPS a través de Caddy. Al Gestor accede SOLO INTELLIHELP (login).
services:
  central:                        # el cerebro: WebSocket del agente + webhooks (MercadoPago/WhatsApp)
    build: ./central
    expose:
      - "8080"                    # interno (solo Caddy/panel lo alcanzan por la red de Docker)
    volumes:
      - ./central/clientes.json:/app/clientes.json
      - ./comun:/app/comun
      - ../DOCUMENTO_MAESTRO.md:/app/DOCUMENTO_MAESTRO.md:ro   # ITHOS explica el sistema desde acá
      - ithos_data:/data         # cachés/estado persistente (planes IA, etc.)
    environment:
      - ITHOS_CLIENTES=/app/clientes.json
      - ITHOS_DATA=/data
    env_file:
      - .env                      # ITHOS_ADMIN_USER / ITHOS_ADMIN_TOKEN
    restart: unless-stopped
    # Al detenerse (deploy/reinicio), el Gestor avisa 'mantenimiento' a los clientes por sus canales
    # ANTES de morir: le damos margen para que esos mensajes salgan antes del SIGKILL.
    stop_grace_period: 30s

  panel:                          # panel superadmin + dashboard del cliente + alta (todo con auth)
    build: ./central
    command: ["uvicorn", "panel:app", "--host", "0.0.0.0", "--port", "8090"]
    expose:
      - "8090"                    # interno: NO se publica (se entra por HTTPS vía Caddy)
    volumes:
      - ./central/clientes.json:/app/clientes.json
      - ./comun:/app/comun
      - ../DOCUMENTO_MAESTRO.md:/app/DOCUMENTO_MAESTRO.md:ro   # ITHOS explica el sistema desde acá
      - ithos_data:/data
    environment:
      - ITHOS_CENTRAL_URL=http://central:8080     # el panel consulta el estado al central (red interna)
      - ITHOS_ALTA_FILE=/data/alta_tokens.json    # tokens de alta de un solo uso (persistente)
      - ITHOS_DATA=/data
    env_file:
      - .env                      # MISMO ITHOS_ADMIN_USER/TOKEN que el central (login del panel)
    depends_on:
      - central
    restart: unless-stopped

  ollama:                         # IA LOCAL: el último eslabón de la cadena, y el que usan los tests
    # POR QUÉ ESTÁ. Las cuotas gratis se agotan —y se agotan justo cuando hay trabajo—. Con Ollama
    # acá, cuando Gemini y Groq se quedan sin cuota ITHOS sigue atendiendo en vez de frenar. Y los
    # tests dejan de gastar la cuota buena: corren contra este, que no tiene límite.
    #
    # QUÉ MODELO. Lo decide la VPS, no el gusto: 2 vCPU, 7,8 GB de RAM y SIN swap. Un 8B en dos
    # núcleos va a paso de hombre, y sin swap un pico de memoria no hace lento al Gestor: lo mata.
    # Por eso un 4B cuantizado (~3,3 GB), que entra con aire y responde en tiempo usable.
    # El modelo se fija en .env (ITHOS_MODELO_LOCAL) para poder subirlo sin tocar esto.
    # Versión fija y con al menos dos semanas en la calle. OJO: hay que subirla de vez en cuando —
    # los modelos nuevos del registro exigen un Ollama reciente y uno viejo se niega a bajarlos
    # ("Please download the latest version"). Pasó con la 0.12.11.
    image: ollama/ollama:0.40.13
    expose:
      - "11434"                   # interno: NUNCA se publica, lo alcanza sólo el Gestor
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m     # el modelo queda cargado: sin esto cada consulta paga el arranque
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1     # 2 vCPU: atender de a una es más rápido que repartirlas
    # Tope de memoria por si un modelo más grande intenta entrar: que muera el contenedor de la IA
    # local —que tiene de dónde caerse, la cadena sigue— y no el Gestor, que no tiene.
    deploy:
      resources:
        limits:
          memory: 5g
    restart: unless-stopped

  caddy:                          # TLS/WSS automático (Let's Encrypt) + ÚNICO que publica puertos
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    env_file:
      - .env                      # ITHOS_DOMINIO: el dominio real vive acá (no en el paquete)
    depends_on:
      - central
      - panel
    restart: unless-stopped

volumes:
  caddy_data:
  ithos_data:
  ollama_models:                  # los pesos del modelo local (varios GB): no se rebajan en cada deploy
